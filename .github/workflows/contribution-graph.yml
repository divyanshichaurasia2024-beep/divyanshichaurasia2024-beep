
name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dark contribution graph
        run: |
          mkdir -p assets

          curl -fsSL \
          https://ghchart.rshah.org/008000/divyanshichaurasia2024-beep \
          -o assets/contribution.svg

          sed -i 's/#ebedf0/#161b22/gi' assets/contribution.svg

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contribution.svg
          git diff --cached --quiet || (
            git commit -m "Update contribution graph"
            git push
          )
